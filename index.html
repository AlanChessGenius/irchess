<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IRCHESS // Ultimate Edition</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <style>
        :root { 
            --accent: #6366f1; 
            --accent-glow: rgba(99, 102, 241, 0.3);
            --bg: #0b0b0e; 
            --card-bg: rgba(18, 18, 22, 0.95);
            --border: rgba(255, 255, 255, 0.1);
            --sq-l: #f0d9b5; 
            --sq-d: #b58863; 
        }
        * { box-sizing: border-box; }
        body { 
            margin: 0; color: #f4f4f5; height: 100vh; overflow: hidden; 
            display: flex; align-items: center; justify-content: center; 
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: var(--bg); user-select: none; 
        }
        
        .ambient-glow { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
        .orb { position: absolute; width: 600px; height: 600px; background: var(--accent); filter: blur(140px); opacity: 0.12; border-radius: 50%; pointer-events: none; transition: background 0.3s; }
        .orb-1 { top: -200px; left: -200px; } 
        .orb-2 { bottom: -200px; right: -200px; }

        .glass-panel { 
            background: var(--card-bg); backdrop-filter: blur(16px); 
            border: 1px solid var(--border); border-radius: 12px; 
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6); 
            pointer-events: auto;
        }
        
        .screen { display: none; position: fixed; inset: 0; align-items: center; justify-content: center; z-index: 1000; background: transparent; pointer-events: none; }
        .screen.active { display: flex !important; pointer-events: auto; }

        .menu-container { width: 540px; padding: 30px; text-align: center; position: relative; z-index: 1005; max-height: 90vh; overflow-y: auto; pointer-events: auto; }
        .brand-subtitle { font-size: 11px; color: var(--accent); font-weight: 800; letter-spacing: 3px; margin-bottom: 4px; text-transform: uppercase; }
        h1 { font-size: 38px; letter-spacing: 8px; text-transform: uppercase; font-weight: 900; margin: 0 0 18px; color: #fff; }
        
        .btn { 
            cursor: pointer; border: none; border-radius: 8px; font-weight: 700; text-transform: uppercase; 
            transition: all 0.2s ease; padding: 12px 22px; letter-spacing: 1.5px; 
            color: #fff; display: inline-block; font-size: 13px; background: var(--accent);
            box-shadow: 0 4px 15px var(--accent-glow); position: relative; z-index: 1010; pointer-events: auto;
        }
        .btn:hover { transform: translateY(-1px); filter: brightness(1.15); box-shadow: 0 6px 20px var(--accent-glow); }
        .btn:active { transform: translateY(0); }
        .btn-secondary { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border); box-shadow: none; }
        .btn-secondary:hover { background: rgba(255, 255, 255, 0.1); }

        .section-title { font-size: 10px; color: var(--accent); font-weight: 800; margin: 14px 0 6px; letter-spacing: 1.5px; text-align: left; }
        
        .time-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; pointer-events: auto; z-index: 1010; position: relative; }
        .time-card { 
            background: rgba(255, 255, 255, 0.02); border: 1px solid var(--border); border-radius: 8px; 
            padding: 9px 6px; text-align: center; transition: all 0.2s ease; cursor: pointer; pointer-events: auto; z-index: 1010; position: relative;
        }
        .time-card:hover { border-color: var(--accent); background: rgba(255, 255, 255, 0.05); }
        .time-card.active-tc { border-color: #fff !important; background: rgba(99, 102, 241, 0.25) !important; box-shadow: 0 0 10px var(--accent-glow); }
        .time-card b { font-size: 15px; display: block; letter-spacing: 1px; font-weight: 800; pointer-events: none; }
        .time-card span { font-size: 9px; color: #34d399; font-weight: 700; letter-spacing: 1px; margin-top: 2px; display: block; pointer-events: none; }

        .rating-footer { display: flex; justify-content: space-around; background: rgba(0, 0, 0, 0.4); padding: 12px; border-radius: 8px; border: 1px solid var(--border); font-size: 11px; color: #a1a1aa; margin-top: 16px; pointer-events: auto; z-index: 1010; position: relative; }
        .rating-footer b { font-size: 14px; color: #fff; font-family: monospace; }

        #game-scr { gap: 30px; padding: 25px; background: var(--bg); z-index: 1000; pointer-events: auto; }
        
        #board { height: 82vh; width: 82vh; max-width: 78vw; max-height: 78vw; display: grid; grid-template: repeat(8, 1fr) / repeat(8, 1fr); border-radius: 6px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.7); position: relative; border: 1px solid rgba(255,255,255,0.08); pointer-events: auto; z-index: 1005; }
        .sq { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; position: relative; cursor: pointer; }
        .w-s { background: var(--sq-l); } .b-s { background: var(--sq-d); }
        .sel { background: rgba(99, 102, 241, 0.5) !important; box-shadow: inset 0 0 10px rgba(0,0,0,0.3); }
        .chk { background: radial-gradient(circle, #ef4444 40%, transparent 85%) !important; }
        
        .p-i { width: 94%; height: 94%; cursor: grab; z-index: 5; filter: none !important; pointer-events: auto; }
        .p-i:active { cursor: grabbing; }

        .side-panel { display: flex; flex-direction: column; justify-content: space-between; height: 82vh; width: 300px; pointer-events: auto; z-index: 1005; }
        
        .player-card { 
            background: var(--card-bg); border: 1px solid var(--border); backdrop-filter: blur(16px);
            padding: 12px 14px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        .player-info { font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 8px; }
        
        .clock { 
            font-family: monospace; font-size: 22px; font-weight: 900; background: #000; 
            padding: 5px 10px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.1); min-width: 85px; text-align: center; 
            letter-spacing: 1px; color: #f4f4f5;
        }
        .clock.active { background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: 0 0 12px var(--accent-glow); }
        .clock.low-time { background: #ef4444 !important; border-color: #ef4444 !important; animation: pulse-red 1s infinite; }
        @keyframes pulse-red { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        .ovl { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.75); z-index: 2000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(10px); pointer-events: auto; }
        .ovl.active { display: flex !important; }

        .settings-btn { position: fixed; top: 20px; right: 20px; cursor: pointer; font-size: 22px; z-index: 3000; opacity: 0.8; transition: 0.2s; background: rgba(255,255,255,0.05); border: 1px solid var(--border); width: 42px; height: 42px; border-radius: 10px; display: flex; align-items: center; justify-content: center; pointer-events: auto; }
        .settings-btn:hover { opacity: 1; border-color: var(--accent); background: rgba(255,255,255,0.1); }

        .opt-btn { width: 54px; height: 36px; border-radius: 6px; cursor: pointer; border: 2px solid rgba(255,255,255,0.15); display: flex;
