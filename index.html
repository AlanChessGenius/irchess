<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IRCHESS // Ultimate Edition</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        :root { 
            --accent: #6366f1; 
            --accent-glow: rgba(99, 102, 241, 0.4);
            --bg: #09090b; 
            --card-bg: rgba(24, 24, 27, 0.95);
            --border: rgba(255, 255, 255, 0.08);
            --sq-l: #f0d9b5; 
            --sq-d: #b58863; 
        }
        * { box-sizing: border-box; }
        body { 
            margin: 0; color: #f4f4f5; height: 100vh; overflow: hidden; 
            display: flex; align-items: center; justify-content: center; 
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: var(--bg); user-select: none; 
        }
        
        .ambient-glow { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
        .orb { position: absolute; width: 700px; height: 700px; background: var(--accent); filter: blur(160px); opacity: 0.15; border-radius: 50%; transition: background 0.4s ease; }
        .orb-1 { top: -250px; left: -250px; } 
        .orb-2 { bottom: -250px; right: -250px; }

        .glass-panel { 
            background: var(--card-bg); backdrop-filter: blur(24px); 
            border: 1px solid var(--border); border-radius: 20px; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7); 
        }
        
        /* Исправлено отображение и слои экранов */
        .screen { display: none; position: fixed; inset: 0; align-items: center; justify-content: center; z-index: 10; background: transparent; }
        .screen.active { display: flex !important; }

        .menu-container { width: 560px; padding: 35px; text-align: center; position: relative; z-index: 20; max-height: 90vh; overflow-y: auto; pointer-events: auto; }
        .brand-subtitle { font-size: 12px; color: var(--accent); font-weight: 800; letter-spacing: 4px; margin-bottom: 4px; text-transform: uppercase; }
        h1 { font-size: 42px; letter-spacing: 10px; text-transform: uppercase; font-weight: 900; margin: 0 0 20px; color: #fff; }
        
        .btn { 
            cursor: pointer; border: none; border-radius: 14px; font-weight: 700; text-transform: uppercase; 
            transition: all 0.2s ease; padding: 14px 24px; letter-spacing: 2px; 
            color: #fff; display: inline-block; font-size: 13px; background: var(--accent);
            box-shadow: 0 4px 20px var(--accent-glow); position: relative; z-index: 30; pointer-events: auto;
        }
        .btn:hover { transform: translateY(-2px); filter: brightness(1.15); box-shadow: 0 6px 25px var(--accent-glow); }
        .btn:active { transform: translateY(0); }
        .btn-secondary { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border); box-shadow: none; }
        .btn-secondary:hover { background: rgba(255, 255, 255, 0.1); }

        .section-title { font-size: 11px; color: var(--accent); font-weight: 800; margin: 16px 0 8px; letter-spacing: 1.5px; text-align: left; }
        
        .time-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; position: relative; z-index: 30; pointer-events: auto; }
        .time-card { 
            background: rgba(255, 255, 255, 0.02); border: 1px solid var(--border); border-radius: 12px; 
            padding: 10px 6px; text-align: center; transition: all 0.2s ease; cursor: pointer; position: relative; z-index: 30; pointer-events: auto;
        }
        .time-card:hover { transform: translateY(-2px); border-color: var(--accent); background: rgba(255, 255, 255, 0.06); }
        .time-card.active-tc { border-color: #fff !important; background: rgba(99, 102, 241, 0.3) !important; box-shadow: 0 0 12px var(--accent-glow); }
        .time-card b { font-size: 16px; display: block; letter-spacing: 1px; font-weight: 800; }
        .time-card span { font-size: 9px; color: #34d399; font-weight: 700; letter-spacing: 1px; margin-top: 2px; display: block; }

        .rating-footer { display: flex; justify-content: space-around; background: rgba(0, 0, 0, 0.3); padding: 12px; border-radius: 14px; border: 1px solid var(--border); font-size: 12px; color: #a1a1aa; margin-top: 20px; position: relative; z-index: 30; }
        .rating-footer b { font-size: 14px; color: #fff; font-family: monospace; }

        #game-scr { gap: 40px; padding: 30px; background: var(--bg); z-index: 100; }
        
        #board { height: 86vh; width: 86vh; max-width: 80vw; max-height: 80vw; display: grid; grid-template: repeat(8, 1fr) / repeat(8, 1fr); border-radius: 8px; overflow: hidden; box-shadow: 0 25px 60px rgba(0,0,0,0.8); position: relative; border: 2px solid rgba(255,255,255,0.05); }
        .sq { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; position: relative; cursor: pointer; }
        .w-s { background: var(--sq-l); } .b-s { background: var(--sq-d); }
        .sel { background: rgba(99, 102, 241, 0.55) !important; box-shadow: inset 0 0 12px rgba(0,0,0,0.3); }
        .chk { background: radial-gradient(circle, #ef4444 40%, transparent 85%) !important; }
        
        .p-i { width: 94%; height: 94%; cursor: grab; z-index: 5; filter: none !important; }
        .p-i:active { cursor: grabbing; }

        .side-panel { display: flex; flex-direction: column; justify-content: space-between; height: 86vh; width: 320px; }
        
        .player-card { 
            background: var(--card-bg); border: 1px solid var(--border); backdrop-filter: blur(20px);
            padding: 14px 16px; border-radius: 16px; display: flex; justify-content: space-between; align-items: center; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .player-info { font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 10px; }
        
        .clock { 
            font-family: monospace; font-size: 24px; font-weight: 900; background: #000; 
            padding: 6px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); min-width: 90px; text-align: center; 
            letter-spacing: 1px; color: #f4f4f5;
        }
        .clock.active { background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: 0 0 15px var(--accent-glow); }
        .clock.low-time { background: #ef4444 !important; border-color: #ef4444 !important; animation: pulse-red 1s infinite; }
        @keyframes pulse-red { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

        /* Оверлеи теперь строго поверх всего и кликабельны */
        .ovl { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.8); z-index: 200; display: none; align-items: center; justify-content: center; backdrop-filter: blur(12px); pointer-events: auto; }
        .ovl.active { display: flex !important; }

        .settings-btn { position: fixed; top: 24px; right: 24px; cursor: pointer; font-size: 26px; z-index: 150; opacity: 0.7; transition: 0.2s; background: rgba(255,255,255,0.05); border: 1px solid var(--border); width: 48px; height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center; }
        .settings
