<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob:; script-src * 'unsafe-inline' 'unsafe-eval'; style-src * 'unsafe-inline';">
    <title>IRCHESS // Next-Gen Platform</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        :root { 
            --accent: #6366f1; 
            --accent-glow: rgba(99, 102, 241, 0.4);
            --bg: #09090b; 
            --card-bg: rgba(24, 24, 27, 0.85);
            --border: rgba(255, 255, 255, 0.08);
            --sq-l: #ebecd0; 
            --sq-d: #779556; 
        }
        * { box-sizing: border-box; }
        body { 
            margin: 0; color: #f4f4f5; height: 100vh; overflow: hidden; 
            display: flex; align-items: center; justify-content: center; 
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: var(--bg); user-select: none; 
        }
        
        .ambient-glow { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
        .orb { position: absolute; width: 700px; height: 700px; background: var(--accent); filter: blur(160px); opacity: 0.1; border-radius: 50%; transition: 0.5s ease; }
        .orb-1 { top: -250px; left: -250px; } 
        .orb-2 { bottom: -250px; right: -250px; }

        .glass-panel { 
            background: var(--card-bg); backdrop-filter: blur(24px); 
            border: 1px solid var(--border); border-radius: 20px; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7); 
        }
        
        .screen { display: none; position: fixed; inset: 0; align-items: center; justify-content: center; z-index: 200; background: var(--bg); }
        .screen.active { display: flex; }

        .menu-container { width: 520px; padding: 40px; text-align: center; position: relative; }
        .brand-subtitle { font-size: 12px; color: var(--accent); font-weight: 800; letter-spacing: 4px; margin-bottom: 6px; text-transform: uppercase; }
        h1 { font-size: 48px; letter-spacing: 12px; text-transform: uppercase; font-weight: 900; margin: 0 0 25px; background: linear-gradient(135deg, #fff 30%, #a1a1aa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .btn { 
            cursor: pointer; border: none; border-radius: 14px; font-weight: 700; text-transform: uppercase; 
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); padding: 16px 28px; letter-spacing: 2px; 
            color: #fff; display: inline-block; font-size: 14px; background: var(--accent);
            box-shadow: 0 4px 20px var(--accent-glow);
        }
        .btn:hover { transform: translateY(-2px); filter: brightness(1.15); box-shadow: 0 6px 25px var(--accent-glow); }
        .btn:active { transform: translateY(0); }
        .btn-secondary { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border); box-shadow: none; }
        .btn-secondary:hover { background: rgba(255, 255, 255, 0.1); box-shadow: none; }

        .time-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 24px 0; }
        .time-card { 
            background: rgba(255, 255, 255, 0.02); border: 1px solid var(--border); border-radius: 14px; 
            padding: 16px 10px; text-align: center; transition: all 0.2s ease; cursor: pointer; 
        }
        .time-card:hover { transform: translateY(-3px); border-color: var(--accent); background: rgba(255, 255, 255, 0.06); box-shadow: 0 10px 20px rgba(0,0,0,0.4); }
        .time-card b { font-size: 20px; display: block; letter-spacing: 1px; font-weight: 800; }
        .time-card span { font-size: 10px; color: #34d399; font-weight: 700; letter-spacing: 1.5px; margin-top: 4px; display: block; }

        .rating-footer { display: flex; justify-content: space-around; background: rgba(0, 0, 0, 0.3); padding: 14px; border-radius: 14px; border: 1px solid var(--border); font-size: 13px; color: #a1a1aa; }
        .rating-footer b { font-size: 15px; color: #fff; font-family: monospace; }

        #game-scr { display: none; position: fixed; inset: 0; z-index: 300; background: var(--bg); align-items: center; justify-content: center; gap: 40px; padding: 30px; }
        #game-scr.active { display: flex; }
        
        #board { height: 86vh; width: 86vh; max-width: 80vw; max-height: 80vw; display: grid; grid-template: repeat(8, 1fr) / repeat(8, 1fr); border-radius: 8px; overflow: hidden; box-shadow: 0 25px 60px rgba(0,0,0,0.8); position: relative; border: 2px solid rgba(255,255,255,0.05); }
        .sq { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; position: relative; cursor: pointer; }
        .w-s { background: var(--sq-l); } .b-s { background: var(--sq-d); }
        .sel { background: rgba(99, 102, 241, 0.55) !important; box-shadow: inset 0 0 12px rgba(0,0,0,0.3); }
        .chk { background: radial-gradient(circle, #ef4444 40%, transparent 85%) !important; }
        
        .p-i { width: 94%; height: 94%; cursor: grab; z-index: 5; filter: none !important; }
        .p-i:active { cursor: grabbing; }

        .side-panel { display: flex; flex-direction: column; justify-content: space-between; height: 86vh; width: 320px; }
        
        .player-card { 
            background: var(--card-bg); border: 1px solid var(--border); backdrop-filter: blur(20px);
            padding: 14px 16px; border-radius: 16px; display: flex; justify-content: space-between; align-items: center; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .player-info { font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 10px; }
        
        .clock { 
            font-family: monospace; font-size: 24px; font-weight: 900; background: #000; 
            padding: 6px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); min-width: 90px; text-align: center; 
            letter-spacing: 1px; color: #f4f4f5;
        }
        .clock.active { background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: 0 0 15px var(--accent-glow); }
        .clock.low-time { background: #ef4444 !important; border-color: #ef4444 !important; animation: pulse-red 1s infinite; }
        @keyframes pulse-red { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

        .ovl { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.8); z-index: 400; display: none; align-items: center; justify-content: center; backdrop-filter: blur(12px); }
        .ovl.active { display: flex; }

        .settings-btn { position: fixed; top: 24px; right: 24px; cursor: pointer; font-size: 26px; z-index: 350; opacity: 0.6; transition: 0.2s; background: rgba(255,255,255,0.05); border: 1px solid var(--border); width: 48px; height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center; }
        .settings-btn:hover { opacity: 1; border-color: var(--accent); background: rgba(255,255,255,0.08); }

        .opt-btn { width: 75px; height: 50px; border-radius: 10px; cursor: pointer; border: 2px solid rgba(255,255,255,0.15); display: flex; overflow: hidden; transition: 0.25s; }
        .opt-btn.active-opt { border-color: #fff; box-shadow: 0 0 15px var(--accent); transform: scale(1.05); }

        @media(max-width: 950px) {
            #game-scr { flex-direction: column; gap: 20px; padding: 15px; }
            #board { height: 62vw; width: 62vw; }
            .side-panel { height: auto; width: 100%; max-width: 62vw; flex-direction: row; gap: 12px; }
            .player-card { flex: 1; padding: 10px; }
            .clock { font-size: 18px; min-width: 70px; padding: 4px 8px; }
        }
    </style>
</head>
<body>
    <div class="ambient-glow">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>
    
    <div class="settings-btn" onclick="ov('set-ovl')">⚙️</div>
    
    <!-- Настройки -->
    <div id="set-ovl" class="ovl" onclick="hd()"><div class="glass-panel menu-container" style="width: 420px; text-align: left;" onclick="event.stopPropagation()">
        <h3 style="margin-top: 0; font-size: 22px; letter
