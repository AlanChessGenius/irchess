<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>IRCHESS</title>
    <script src="chess.min.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        :root { 
            --accent: #7b61ff; --bg: #050505; --glass: rgba(15,15,20,0.98);
            --sq-l: #f0d9b5; --sq-d: #b58863; 
        }
        body { margin:0; color:#fff; height:100vh; overflow:hidden; display:flex; align-items:center; justify-content:center; font-family:sans-serif; background: var(--bg); transition:0.5s; user-select: none; }
        
        .blobs { position: fixed; inset: 0; z-index: -1; pointer-events: none; }
        .blob { position: absolute; width: 600px; height: 600px; background: var(--accent); filter: blur(150px); opacity: 0.12; border-radius: 50%; animation: move 20s infinite alternate; }
        .b1 { top: -200px; left: -200px; } .b2 { bottom: -200px; right: -200px; }
        @keyframes move { from { transform: translate(0,0); } to { transform: translate(60px, 60px); } }

        .glass { background:var(--glass); backdrop-filter:blur(30px); border:1px solid rgba(255,255,255,0.1); border-radius:32px; box-shadow:0 30px 80px #000; animation: slideIn 0.4s ease; }
        @keyframes slideIn { from{opacity:0; transform:translateY(20px)} to{opacity:1; transform:translateY(0)} }
        
        .g-box { width:620px; padding:45px; text-align:center; position:relative; }
        .u-nick { font-size: 14px; color: var(--accent); font-weight: 900; letter-spacing: 3px; margin-bottom: 5px; text-transform: uppercase; }
        h1 { font-size:60px; letter-spacing:15px; text-transform:uppercase; font-weight:900; margin:0 0 10px; }
        
        .btn { cursor:pointer; border:none; border-radius:14px; font-weight:800; text-transform:uppercase; transition:0.3s; padding:18px 35px; letter-spacing:4px; color:#fff; display: inline-block; }
        .btn:hover { transform:translateY(-2px); box-shadow: 0 5px 15px var(--accent); }
        .b-st { background: var(--accent); }
        .b-off { background: #1a1a1a; border: 1px solid var(--accent); margin-top: 15px; width: 100%; }

        .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin:20px 0; }
        .card { background:rgba(255,255,255,0.02); border:1px solid #333; border-radius:18px; padding:15px 5px; text-align: center; transition: 0.3s; cursor: pointer; }
        .card:hover { transform: translateY(-5px); border-color: var(--accent); background: rgba(255,255,255,0.05); }
        .card b { font-size:22px; display:block; }
        .card span { font-size: 9px; color: #44ff88; font-weight: bold; }

        .rf { display:flex; justify-content:space-around; background:rgba(0,0,0,0.5); padding:18px; border-radius:20px; border:1px solid #222; }
        .rf b { font-size:18px; color: var(--accent); font-family: monospace; }

        #board { height: 96vmin; width: 96vmin; display:grid; grid-template: repeat(8, 12.5%) / repeat(8, 12.5%); box-shadow:0 0 100px #000; border:2px solid #333; position: relative; }
        .sq { width:100%; height:100%; display:flex; align-items:center; justify-content:center; position: relative; }
        .w-s { background: var(--sq-l); } .b-s { background: var(--sq-d); }
        .sel { background: rgba(123, 97, 255, 0.7) !important; }
        .chk { background: radial-gradient(circle, #ff4d4d 30%, transparent 80%) !important; }
        
        .p-i { width:100%; height:100%; cursor: grab; z-index: 5; pointer-events: none; }
        .dragging { pointer-events: none; position: fixed; z-index: 1000; transform: translate(-50%, -50%); }

        .ovl { position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:400; display:none; align-items:center; justify-content:center; backdrop-filter:blur(10px); }
        .settings-btn { position:fixed; top:30px; right:30px; cursor:pointer; font-size:35px; z-index:350; opacity:0.3; transition: 0.3s; }
        .settings-btn:hover { opacity:1; transform: rotate(90deg); }

        #game-scr { display:none; position: fixed; inset: 0; z-index: 300; background: #000; align-items:center; justify-content:center; gap: 40px; }
        .board-theme-btn { width: 80px; height: 50px; border-radius: 8px; cursor: pointer; border: 3px solid #fff; display: flex; overflow: hidden; }
    </style>
</head>
<body>
    <div class="blobs"><div class="blob b1"></div><div class="blob b2"></div></div>
    <div class="settings-btn" onclick="ov('set-ovl')">⚙️</div>
    
    <div id="set-ovl" class="ovl" onclick="hd()"><div class="glass g-box" style="width:380px" onclick="event.stopPropagation()">
        <h3>ИНТЕРФЕЙС</h3>
        <div style="display:flex; gap:20px; justify-content:center; margin-bottom: 20px">
            <div style="width:60px; height:40px; background:#7b61ff; cursor:pointer; border-radius:10px; border:2px solid #fff" onclick="stT('p')"></div>
            <div style="width:60px; height:40px; background:#45a049; cursor:pointer; border-radius:10px; border:3px solid #fff" onclick="stT('g')"></div>
        </div>
        <h3>ЦВЕТ ДОСКИ</h3>
        <div style="display:flex; gap:20px; justify-content:center; margin-bottom: 25px">
            <div class="board-theme-btn" onclick="setBoard('brown')"><div style="flex:1;background:#f0d9b5"></div><div style="flex:1;background:#b58863"></div></div>
            <div class="board-theme-btn" onclick="setBoard('green')"><div style="flex:1;background:#ebecd0"></div><div style="flex:1;background:#779556"></div></div>
        </div>
        <button class="btn b-off" onclick="startOffline()">ИГРАТЬ ОФФЛАЙН</button><br><br>
        <button class="btn b-st" style="background:#222; font-size:12px; width:100%" onclick="hd()">ЗАКРЫТЬ</button>
    </div></div>

    <!-- Главное меню -->
    <div id="m-scr" class="scr"><div class="glass g-box">
        <div id="hi" class="u-nick">...</div><h1>IRCHESS</h1>
        <div style="display:flex; gap:15px; margin:25px 0"><button class="btn b-st" style="flex:1" onclick="ov('p-scr')">ПРОФИЛЬ</button><button class="btn b-st" style="flex:1; background:#111; border:2px solid var(--accent)" onclick="ov('f-scr')">ДРУЗЬЯ</button></div>
        
        <div style="font-size:12px; color:var(--accent); font-weight:bold; margin-bottom:5px; text-transform:uppercase;">Выберите контроль времени:</div>
        <div class="grid">
            <div class="card" onclick="startSearch('1+0')"><b>1+0</b><span>ONLINE</span></div>
            <div class="card" onclick="startSearch('2+1')"><b>2+1</b><span>ONLINE</span></div>
            <div class="card" onclick="startSearch('3+0')"><b>3+0</b><span>ONLINE</span></div>
            <div class="card" onclick="startSearch('3+2')"><b>3+2</b><span>ONLINE</span></div>
            <div class="card" onclick="startSearch('5+0')"><b>5+0</b><span>ONLINE</span></div>
            <div class="card" onclick="startSearch('5+3')"><b>5+3</b><span>ONLINE</span></div>
            <div class="card" onclick="startSearch('10+0')"><b>10+0</b><span>ONLINE</span></div>
            <div class="card" onclick="startSearch('15+10')"><b>15+10</b><span>ONLINE</span></div>
            <div class="card" onclick="startSearch('30+0')"><b>30+0</b><span>ONLINE</span></div>
        </div>
        <div class="rf"><div>BUL <b id="rb">1400</b></div><div>BLZ <b id="rl">1400</b></div><div>RAP <b id="rr">1400</b></div></div>
    </div></div>

    <!-- Окно поиска соперника -->
    <div id="wait-scr" class="ovl"><div class="glass g-box" style="width:400px;">
        <h2>ПОИСК СОПЕРНИКА</h2>
        <p id="search-status" style="font-size: 15px; color: var(--accent); margin: 20px 0; font-weight: bold;">Ищем игрока...</p>
        <button class="btn b-st" style="background:#222; width:100%" onclick="cancelSearch()">ОТМЕНИТЬ</button>
    </div></div>

    <div id="p-scr" class="ovl" onclick="hd()"><div class="glass g-box" style="width:520px" onclick="event.stopPropagation()"><h2>ПРОФИЛЬ</h2><div id="p-d" style="text-align:left; line-height:2.2; padding:30px; background:rgba(0,0,0,0.4); border-radius:24px; margin-bottom:20px; border:1px solid var(--accent)"></div><button class="btn b-st" style="background:#222; width:100%" onclick="hd()">ЗАКРЫТЬ</button></div></div>
    <div id="f-scr" class="ovl" onclick="hd()"><div class="glass g-box" style="width:450px" onclick="event.stopPropagation()"><h2>ДРУЗЬЯ</h2><div style="margin-bottom: 20px; opacity: 0.5;">СЕРВИС В РАЗРАБОТКЕ</div><button class="btn b-st" style="background:#222; width:100%" onclick="hd()">ЗАКРЫТЬ</button></div></div>
    <div id="res-scr" class="ovl"><div class="glass g-box"><h1 id="res-tt">КОНЕЦ ИГРЫ</h1><p id="res-ds" style="font-size: 24px; margin-bottom: 30px;"></p><button class="btn b-st" onclick="location.reload()">В МЕНЮ</button></div></div>

    <div id="game-scr"><div id="board"></div><div class="glass" style="padding:25px; text-align:center; min-width: 220px;"><div id="mode-title" style="color:var(--accent); font-weight:900; margin-bottom:15px; font-size: 20px;">ONLINE</div><button class="btn" style="background:#1a1a1a; width: 100%; border: 1px solid #333; font-size: 12px;" onclick="location.reload()">В МЕНЮ</button></div></div>

    <script>
        let game, sel = null, draggingFrom = null;
        let myColor = 'white';
        let currentRoomId = null;
        let activeTimeControl = null;

        // Автоматически подключаемся к твоему серверу (на Render или локально)
        const socket = io(); 

        window.onload = () => { 
            stT(localStorage.getItem('ir_theme')||'p'); 
            setBoard(localStorage.getItem('ir_board')||'brown');
            initU(); 
        };

        // Нажатие на карточку времени — запуск поиска
        function startSearch(timeControl) {
            activeTimeControl = timeControl;
            socket.emit('find_game', timeControl);
            document.getElementById('search-status').innerText = `Поиск игры (${timeControl})...`;
            ov('wait-scr');
        }

        function cancelSearch() {
            if(activeTimeControl) {
                socket.emit('cancel_search', activeTimeControl);
            }
            hd();
        }

        // Сервер нашел соперника и создал игру
        socket.on('game_started', (data) => {
            currentRoomId = data.roomId;
            myColor = data.color; // Сервер сам решает, кто белые, а кто черные
            hd();
            game = new Chess();
            document.getElementById('m-scr').style.display = 'none';
            document.getElementById('game-scr').style.display = 'flex';
            render();
        });

        // Пришел ход от соперника
        socket.on('move', (moveData) => {
            game.move(moveData);
            render();
            checkEnd();
        });

        const names = ["Storm", "Ace", "Nova", "Rex", "Shadow", "King", "Wolf", "Alpha", "Titan", "Viper"];

        function initU() {
            let u = JSON.parse(localStorage.getItem('ir_user')) || { nick: names[Math.floor(Math.random()*names.length)] + "_" + Math.floor(Math.random()*99), rating: {bullet:1400, blitz:1400, rapid:1400}, games:0, w:0, l:0, d:0 };
            localStorage.setItem('ir_user', JSON.stringify(u));
            document.getElementById('hi').innerText = u.nick.toUpperCase();
            document.getElementById('rb').innerText = Math.round(u.rating.bullet);
            document.getElementById('rl').innerText = Math.round(u.rating.blitz);
            document.getElementById('rr').innerText = Math.round(u.rating.rapid);
        }

        function ov(id){ hd(); document.getElementById(id).style.display='flex'; if(id==='p-scr') upP(); }
        function hd(){ document.querySelectorAll('.ovl').forEach(o=>o.style.display='none'); }
        
        function upP(){
            const u = JSON.parse(localStorage.getItem('ir_user'));
            document.getElementById('p-d').innerHTML = `<b>НИК:</b> <span style="color:var(--accent)">${u.nick}</span><br><b>ИГР:</b> ${u.games}<br><b>W/L/D:</b> ${u.w}/${u.l}/${u.d}<br><hr style="opacity:0.1;margin:15px 0"><b>BULLET:</b> ${Math.round(u.rating.bullet)}<br><b>BLITZ:</b> ${Math.round(u.rating.blitz)}<br><b>RAPID:</b> ${Math.round(u.rating.rapid)}`;
        }

        function stT(c){ document.documentElement.style.setProperty('--accent', c==='p'?'#7b61ff':'#45a049'); localStorage.setItem('ir_theme', c); }
        function setBoard(t) { const r = document.documentElement; if(t==='brown'){ r.style.setProperty('--sq-l','#f0d9b5'); r.style.setProperty('--sq-d','#b58863'); } else { r.style.setProperty('--sq-l','#ebecd0'); r.style.setProperty('--sq-d','#779556'); } localStorage.setItem('ir_board',t); }

        function startOffline() {
            if(typeof Chess === 'undefined') { alert("chess.min.js не найден!"); return; }
            game = new Chess(); hd(); myColor = 'white';
            document.getElementById('m-scr').style.display='none';
            document.getElementById('game-scr').style.display='flex';
            document.getElementById('mode-title').innerText = "OFFLINE PLAY";
            render();
        }

        // Отрисовка с автоматическим разворотом доски для черных
        function render(){
            const b=document.getElementById('board'); b.innerHTML=''; const pos=game.board();
            
            let rows = [0,1,2,3,4,5,6,7];
            let cols = [0,1,2,3,4,5,6,7];
            if(myColor === 'black') {
                rows.reverse();
                cols.reverse();
            }

            for(let r of rows) {
                for(let c of cols) {
                    let s=pos[r][c], id=String.fromCharCode(97+c)+(8-r), d=document.createElement('div');
                    d.className=`sq ${(r+c)%2===0?'w-s':'b-s'} ${sel===id?'sel':''}`; d.dataset.id = id;
                    if(game.in_check() && s && s.type==='k' && s.color===game.turn()) d.classList.add('chk');
                    if(s && draggingFrom !== id){
                        const img = document.createElement('img');
                        img.src = `pieces/${s.color}${s.type}.png`;
                        img.className = 'p-i';
                        d.onmousedown = (e) => startDrag(e, id, img);
                        d.appendChild(img);
                    }
                    d.onclick = () => squareClick(id);
                    b.appendChild(d);
                }
            }
        }

        function squareClick(id) {
            const piece = game.get(id);
            if(game.turn() !== myColor && document.getElementById('mode-title').innerText !== "OFFLINE PLAY") return;

            if(sel === id) { sel = null; } 
            else if(piece && piece.color === game.turn()) { sel = id; } 
            else if(sel) {
                const m = game.move({from:sel, to:id, promotion:'q'});
                if(m) { 
                    sel = null; 
                    checkEnd();
                    if(currentRoomId && document.getElementById('mode-title').innerText !== "OFFLINE PLAY") {
                        socket.emit('move', { roomId: currentRoomId, moveData: {from: m.from, to: m.to, promotion: 'q'} });
                    }
                } else { sel = null; }
            }
            render();
        }

        function startDrag(e, from, img){
            if(game.get(from).color !== game.turn()) return;
            if(game.turn() !== myColor && document.getElementById('mode-title').innerText !== "OFFLINE PLAY") return;

            sel = from; draggingFrom = from; render(); 
            const ghost = img.cloneNode(true);
            ghost.classList.add('dragging');
            const sqSize = document.querySelector('.sq').offsetWidth;
            ghost.style.width = sqSize + 'px'; ghost.style.height = sqSize + 'px';
            document.body.appendChild(ghost);

            const move = (m) => { ghost.style.left = m.clientX + 'px'; ghost.style.top = m.clientY + 'px'; };
            const stop = (s) => {
                document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', stop);
                document.body.removeChild(ghost); draggingFrom = null;
                let t = document.elementFromPoint(s.clientX, s.clientY);
                let to = t ? (t.dataset.id || t.parentElement.dataset.id) : null;
                if(to && to !== from) {
                    const m = game.move({from:sel, to:to, promotion:'q'});
                    if(m) { 
                        sel = null; 
                        checkEnd();
                        if(currentRoomId && document.getElementById('mode-title').innerText !== "OFFLINE PLAY") {
                            socket.emit('move', { roomId: currentRoomId, moveData: {from: m.from, to: m.to, promotion: 'q'} });
                        }
                    }
                }
                render();
            };
            document.addEventListener('mousemove', move); document.addEventListener('mouseup', stop); move(e);
        }

        function checkEnd() {
            if(game.game_over()) {
                document.getElementById('res-scr').style.display = 'flex';
                let msg = "НИЧЬЯ!";
                if(game.in_checkmate()) msg = (game.turn()==='b'?"БЕЛЫЕ":"ЧЕРНЫЕ") + " ПОБЕДИЛИ!";
                document.getElementById('res-ds').innerText = msg;
            }
        }
    </script>
</body>
</html>
