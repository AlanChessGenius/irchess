<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IRCHESS // Ultimate Edition</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <style>
        :root { 
            --accent: #6366f1; 
            --accent-glow: rgba(99, 102, 241, 0.3);
            --bg: #0b0b0e; 
            --card-bg: #131318; 
            --border: rgba(255, 255, 255, 0.1);
            --sq-l: #f0d9b5; 
            --sq-d: #b58863; 
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; color: #f4f4f5; height: 100vh; width: 100vw; overflow: hidden; 
            display: flex; align-items: center; justify-content: center; 
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: var(--bg); 
        }
        
        .ambient-glow { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
        .orb { position: absolute; width: 700px; height: 700px; background: var(--accent); filter: blur(150px); opacity: 0.12; border-radius: 50%; pointer-events: none; }
        .orb-1 { top: -200px; left: -200px; } 
        .orb-2 { bottom: -200px; right: -200px; }

        .glass-panel { 
            background: var(--card-bg); 
            border: 1px solid var(--border); 
            border-radius: 16px; 
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8); 
            pointer-events: auto !important;
        }
        
        .app-screen { display: none; width: 100%; height: 100%; align-items: center; justify-content: center; position: absolute; inset: 0; z-index: 10; background: var(--bg); }
        .app-screen.active { display: flex !important; }

        .menu-container { width: 720px; max-width: 96vw; padding: 44px; text-align: center; max-height: 96vh; overflow-y: auto; position: relative; z-index: 20; pointer-events: auto !important; }
        .brand-subtitle { font-size: 12px; color: var(--accent); font-weight: 800; letter-spacing: 4px; margin-bottom: 8px; text-transform: uppercase; }
        h1 { font-size: 48px; letter-spacing: 10px; text-transform: uppercase; font-weight: 900; margin: 0 0 26px; color: #fff; }
        
        .btn { 
            cursor: pointer; border: none; border-radius: 10px; font-weight: 700; text-transform: uppercase; 
            transition: all 0.2s ease; padding: 17px 28px; letter-spacing: 2px; 
            color: #fff; display: inline-block; font-size: 15px; background: var(--accent);
            box-shadow: 0 6px 20px var(--accent-glow); width: 100%; position: relative; z-index: 30;
            pointer-events: auto !important;
        }
        .btn:hover { transform: translateY(-1px); filter: brightness(1.15); box-shadow: 0 8px 25px var(--accent-glow); }
        .btn:active { transform: translateY(0); }
        .btn-secondary { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border); box-shadow: none; }
        .btn-secondary:hover { background: rgba(255, 255, 255, 0.1); }

        .section-title { font-size: 11px; color: var(--accent); font-weight: 800; margin: 20px 0 10px; letter-spacing: 2px; text-align: left; }
        
        .time-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; position: relative; z-index: 30; pointer-events: auto !important; }
        .time-card { 
            background: rgba(255, 255, 255, 0.02); border: 1px solid var(--border); border-radius: 10px; 
            padding: 14px 10px; text-align: center; transition: all 0.2s ease; cursor: pointer; position: relative; z-index: 30;
            pointer-events: auto !important;
        }
        .time-card:hover { border-color: var(--accent); background: rgba(255, 255, 255, 0.05); }
        .time-card.active-tc { border-color: #fff !important; background: rgba(99, 102, 241, 0.25) !important; box-shadow: 0 0 12px var(--accent-glow); }
        .time-card b { font-size: 17px; display: block; letter-spacing: 1px; font-weight: 800; pointer-events: none; }
        .time-card span { font-size: 10px; color: #34d399; font-weight: 700; letter-spacing: 1px; margin-top: 3px; display: block; pointer-events: none; }

        .rating-footer { display: flex; justify-content: space-around; background: rgba(0, 0, 0, 0.4); padding: 16px; border-radius: 10px; border: 1px solid var(--border); font-size: 12px; color: #a1a1aa; margin-top: 24px; position: relative; z-index: 30; pointer-events: auto !important; }
        .rating-footer b { font-size: 15px; color: #fff; font-family: monospace; }

        #game-scr { gap: 15px; padding: 10px; flex-direction: column; justify-content: center; }
        
        #board { height: 68vh; width: 68vh; max-width: 90vw; max-height: 90vw; display: grid; grid-template: repeat(8, 1fr) / repeat(8, 1fr); border-radius: 8px; overflow: hidden; box-shadow: 0 25px 50px rgba(0,0,0,0.7); position: relative; border: 1px solid rgba(255,255,255,0.08); z-index: 15; pointer-events: auto !important; }
        .sq { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; position: relative; cursor: pointer; pointer-events: auto !important; }
        .w-s { background: var(--sq-l); } .b-s { background: var(--sq-d); }
        .sel { background: rgba(99, 102, 241, 0.5) !important; box-shadow: inset 0 0 10px rgba(0,0,0,0.3); }
        .chk { background: radial-gradient(circle, #ef4444 40%, transparent 85%) !important; }
        
        .p-i { width: 100%; height: 100%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: min(8vw, 42px); font-weight: bold; z-index: 20; position: absolute; inset: 0; pointer-events: auto !important; }
        .p-i img { width: 92%; height: 92%; object-fit: contain; pointer-events: none; }
        .p-i:active { cursor: grabbing; }

        .side-panel { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 90vw; gap: 8px; z-index: 15; pointer-events: auto !important; }
        .player-card { 
            background: var(--card-bg); border: 1px solid var(--border); 
            padding: 8px 12px; border-radius: 8px; display: flex; align-items: center; justify-content: space-between; 
            box-shadow: 0 6px 18px rgba(0,0,0,0.3); flex: 1; pointer-events: auto !important;
        }
        .player-info { font-weight: 700; font-size: 12px; display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 55vw; }
        
        .clock { 
            font-family: monospace; font-size: 14px; font-weight: 900; background: #000; 
            padding: 4px 8px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.1); min-width: 60px; text-align: right; color: #f4f4f5; flex-shrink: 0; margin-left: auto;
        }
        .clock.active { background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: 0 0 10px var(--accent-glow); }
        .clock.low-time { background: #ef4444 !important; border-color: #ef4444 !important; animation: pulse-red 1s infinite; }
        @keyframes pulse-red { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        .ovl { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.82); z-index: 1000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(12px); pointer-events: auto !important; }
        .ovl.active { display: flex !important; }
