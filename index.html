<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IRCHESS</title>
    <!-- Подключение библиотеки шахматной логики -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        :root { 
            --accent: #7b61ff; 
            --bg: #0c0c0e; 
            --glass: rgba(18, 18, 24, 0.95);
            --sq-l: #f0d9b5; 
            --sq-d: #b58863; 
        }
        * { box-sizing: border-box; }
        body { 
            margin:0; color:#fff; height:100vh; overflow:hidden; 
            display:flex; align-items:center; justify-content:center; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: var(--bg); user-select: none; 
        }
        
        .blobs { position: fixed; inset: 0; z-index: -1; pointer-events: none; }
        .blob { position: absolute; width: 600px; height: 600px; background: var(--accent); filter: blur(150px); opacity: 0.12; border-radius: 50%; }
        .b1 { top: -200px; left: -200px; } .b2 { bottom: -200px; right: -200px; }

        .glass { background:var(--glass); backdrop-filter:blur(20px); border:1px solid rgba(255,255,255,0.08); border-radius:24px; box-shadow:0 20px 60px #000; }
        
        .g-box { width:460px; padding:35px; text-align:center; position:relative; }
        .u-nick { font-size: 13px; color: var(--accent); font-weight: 800; letter-spacing: 2px; margin-bottom: 4px; text-transform: uppercase; }
        h1 { font-size:42px; letter-spacing:10px; text-transform:uppercase; font-weight:900; margin:0 0 15px; }
        
        .btn { cursor:pointer; border:none; border-radius:12px; font-weight:700; text-transform:uppercase; transition:0.2s; padding:14px 24px; letter-spacing:2px; color:#fff; display: inline-block; font-size: 13px; }
        .btn:hover { transform:translateY(-2px); filter: brightness(1.1); }
        .b-st { background: var(--accent); }

        .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:20px 0; }
        .card { background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.08); border-radius:14px; padding:12px 5px; text-align: center; transition: 0.2s; cursor: pointer; }
        .card:hover { transform: translateY(-3px); border-color: var(--accent); background: rgba(255,255,255,0.07); }
        .card b { font-size:18px; display:block; }
        .card span { font-size: 9px; color: #44ff88; font-weight: bold; letter-spacing: 1px; }

        .rf { display:flex; justify-content:space-around; background:rgba(0,0,0,0.4); padding:12px; border-radius:14px; border:1px solid rgba(255,255,255,0.05); font-size: 12px; }
        .rf b { font-size:14px; color: var(--accent); font-family: monospace; }

        /* ИГРОВОЙ ЭКРАН LICHESS STYLE */
        #game-scr { display:none; position: fixed; inset: 0; z-index: 300; background: var(--bg); align-items:center; justify-content:center; gap: 30px; padding: 20px; }
        
        #board { height: 85vh; width: 85vh; max-width: 80vw; max-height: 80vw; display:grid; grid-template: repeat(8, 1fr) / repeat(8, 1fr); border-radius: 6px; overflow: hidden; box-shadow: 0 15px 50px rgba(0,0,0,0.8); position: relative; }
        .sq { width:100%; height:100%; display:flex; align-items:center; justify-content:center; position: relative; cursor: pointer; }
        .w-s { background: var(--sq-l); } .b-s { background: var(--sq-d); }
        .sel { background: rgba(123, 97, 255, 0.65) !important; }
        .chk { background: radial-gradient(circle, #ff4757 30%, transparent 80%) !important; }
        
        .p-i { width: 85%; height: 85%; cursor: grab; z-index: 5; }
        .p-i:active { cursor: grabbing; }

        .side-panel { display: flex; flex-direction: column; justify-content: space-between; height: 85vh; width: 320px; }
        
        .player-card { 
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); 
            padding: 15px; border-radius: 14px; display: flex; justify-content: space-between; align-items: center; 
        }
        .player-info { font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 10px; }
        .clock { 
            font-family: monospace; font-size: 26px; font-weight: 900; background: #000; 
            padding: 6px 14px; border-radius: 8px; border: 1px solid #333; min-width: 100px; text-align: center; 
        }
        .clock.active { background: var(--accent); color: #fff; border-color: var(--accent); }
        .clock.low-time { background: #ff4757 !important; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.7; } }

        .ovl { position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:400; display:none; align-items:center; justify-content:center; backdrop-filter:blur(8px); }
        .settings-btn { position:fixed; top:20px; right:20px; cursor:pointer; font-size:28px; z-index:350; opacity:0.4; transition: 0.2s; }
        .settings-btn:hover { opacity:1; }

        .opt-btn { width: 65px; height: 45px; border-radius: 8px; cursor: pointer; border: 2px solid rgba(255,255,255,0.2); display: flex; overflow: hidden; transition: 0.2s; }
        .opt-btn.active-opt { border-color: #fff; box-shadow: 0 0 10px var(--accent); transform: scale(1.05); }

        @media(max-width: 900px) {
            #game-scr { flex-direction: column; gap: 15px; padding: 10px; }
            #board { height: 60vw; width: 60vw; }
            .side-panel { height: auto; width: 100%; max-width: 60vw; flex-direction: row; gap: 10px; }
            .player-card { flex: 1; padding: 10px; }
            .clock { font-size: 18px; min-width: 70px; padding: 4px 8px; }
        }
    </style>
</head>
<body>
    <div class="blobs"><div class="blob b1"></div><div class="blob b2"></div></div>
    <div class="settings-btn" onclick="ov('set-ovl')">⚙️</div>
    
    <!-- Настройки -->
    <div id="set-ovl" class="ovl" onclick="hd()"><div class="glass g-box" style="width:380px" onclick="event.stopPropagation()">
        <h3 style="margin-top:0">НАСТРОЙКИ</h3>
        
        <div style="font-size:12px; color:var(--accent); font-weight:800; margin-bottom:8px; text-align:left;">ФОН (АКЦЕНТ)</div>
        <div style="display:flex; gap:12px; justify-content:center; margin-bottom: 20px">
            <div id="th-p" class="opt-btn" style="background:#7b61ff" onclick="stT('p')"></div>
            <div id="th-g" class="opt-btn" style="background:#45a049" onclick="stT('g')"></div>
            <div id="th-b" class="opt-btn" style="background:#ff4757" onclick="stT('b')"></div>
        </div>

        <div style="font-size:12px; color:var(--accent); font-weight:800; margin-bottom:8px; text-align:left;">ЦВЕТ ДОСКИ</div>
        <div style="display:flex; gap:12px; justify-content:center; margin-bottom: 20px">
            <div id="br-brown" class="opt-btn" onclick="setBoard('brown')"><div style="flex:1;background:#f0d9b5"></div><div style="flex:1;background:#b58863"></div></div>
            <div id="br-green" class="opt-btn" onclick="setBoard('green')"><div style="flex:1;background:#ebecd0"></div><div style="flex:1;background:#779556"></div></div>
        </div>

        <button class="btn" style="background:#1a1a1a; border:1px solid rgba(255,255,255,0.1); width:100%; margin-bottom:12px;" onclick="startOffline()">ИГРАТЬ ОФФЛАЙН (1 МЫШКА)</button>
        <button class="btn b-st" style="background:#222; width:100%" onclick="hd()">ЗАКРЫТЬ</button>
    </div></div>

    <!-- Главное меню -->
    <div id="m-scr" style="position:fixed; inset:0; display:flex; align-items:center; justify-content:center; z-index:200;">
        <div class="glass g-box">
            <div id="hi" class="u-nick">...</div><h1>IRCHESS</h1>
            
            <div style="font-size:11px; color:var(--accent); font-weight:800; margin-bottom:8px; letter-spacing: 1px;">ВЫБЕРИТЕ КОНТРОЛЬ ВРЕМЕНИ:</div>
            <div class="grid">
                <div class="card" onclick="startSearch('1+0')"><b>1+0</b><span>BULLET</span></div>
                <div class="card" onclick="startSearch('2+1')"><b>2+1</b><span>BULLET</span></div>
                <div class="card" onclick="startSearch('3+0')"><b>3+0</b><span>BLITZ</span></div>
                <div class="card" onclick="startSearch('3+2')"><b>3+2</b><span>BLITZ</span></div>
                <div class="card" onclick="startSearch('5+0')"><b>5+0</b><span>BLITZ</span></div>
                <div class="card" onclick="startSearch('5+3')"><b>5+3</b><span>BLITZ</span></div>
                <div class="card" onclick="startSearch('10+0')"><b>10+0</b><span>RAPID</span></div>
                <div class="card" onclick="startSearch('15+10')"><b>15+10</b><span>RAPID</span></div>
                <div class="card" onclick="startSearch('30+0')"><b>30+0</b><span>RAPID</span></div>
            </div>
            <div class="rf"><div>BUL <b id="rb">1400</b></div><div>BLZ <b id="rl">1400</b></div><div>RAP <b id="rr">1400</b></div></div>
        </div>
    </div>

    <!-- Поиск соперника -->
    <div id="wait-scr" class="ovl"><div class="glass g-box" style="width:360px;">
        <h3 style="margin-top:0">ПОИСК СОПЕРНИКА</h3>
        <p id="search-status" style="font-size: 14px; color: var(--accent); margin: 20px 0; font-weight: 700;">Ищем игрока...</p>
        <button class="btn b-st" style="background:#222; width:100%" onclick="cancelSearch()">ОТМЕНИТЬ</button>
    </div></div>

    <!-- Окно конца игры -->
    <div id="res-scr" class="ovl"><div class="glass g-box" style="width:380px"><h2 id="res-tt" style="margin-top:0">КОНЕЦ ИГРЫ</h2><p id="res-ds" style="font-size: 20px; margin-bottom: 25px; font-weight:700;"></p><button class="btn b-st" onclick="location.reload()">В МЕНЮ</button></div></div>

    <!-- Игровой экран -->
    <div id="game-scr">
        <div id="board"></div>
        <div class="side-panel">
            <div class="player-card">
                <div class="player-info"><span style="opacity:0.6">👤</span> <span id="opp-name">Соперник</span></div>
                <div id="opp-clock" class="clock">00:00</div>
            </div>

            <div class="glass" style="padding:20px; text-align:center;">
                <div id="mode-title" style="color:var(--accent); font-weight:800; margin-bottom:12px; font-size: 14px;">ONLINE</div>
                <button class="btn" style="background:rgba(255,255,255,0.05); width: 100%; border: 1px solid rgba(255,255,255,0.1); font-size: 11px;" onclick="location.reload()">СДАЧА / В МЕНЮ</button>
            </div>

            <div class="player-card">
                <div class="player-info"><span style="opacity:0.6">👤</span> <span id="my-name">Вы</span></div>
                <div id="my-clock" class="clock">00:00</div>
            </div>
        </div>
    </div>

    <script>
        let game, sel = null;
        let myColor = 'white';
        let currentRoomId = null;
        let activeTimeControl = '3+0';
        let isOffline = false;

        let whiteTime = 180, blackTime = 180, increment = 0;
        let timerInterval = null;

        const socket = io(); 

        window.onload = () => { 
            const savedTheme = localStorage.getItem('ir_theme') || 'p';
            const savedBoard = localStorage.getItem('ir_board') || 'brown';
            stT(savedTheme, false);
            setBoard(savedBoard, false);
            initU(); 
        };

        function startSearch(tc) {
            isOffline = false;
            activeTimeControl = tc;
            socket.emit('find_game', tc);
            document.getElementById('search-status').innerText = `Поиск игры (${tc})...`;
            ov('wait-scr');
        }

        function cancelSearch() {
            if(activeTimeControl) socket.emit('cancel_search', activeTimeControl);
            hd();
        }

        function startOffline() {
            isOffline = true;
            hd();
            myColor = 'white';
            document.getElementById('m-scr').style.display = 'none';
            document.getElementById('game-scr').style.display = 'flex';
            document.getElementById('mode-title').innerText = "ОФФЛАЙН ИГРА";
            document.getElementById('opp-name').innerText = "Игрок 2 (Черные)";
            document.getElementById('my-name').innerText = "Игрок 1 (Белые)";
            
            initGameConfig('5+0');
        }

        socket.on('game_started', (data) => {
            currentRoomId = data.roomId;
            myColor = data.color;
            hd();
            document.getElementById('opp-name').innerText = "Соперник";
            document.getElementById('my-name').innerText = JSON.parse(localStorage.getItem('ir_user')).nick;
            initGameConfig(activeTimeControl);
        });

        socket.on('move', (moveData) => {
            const result = game.move(moveData);
            if(result) {
                addIncrement(result.color);
                render();
                checkEnd();
            }
        });

        function initU() {
            let u = JSON.parse(localStorage.getItem('ir_user')) || { nick: "Игрок_" + Math.floor(Math.random()*899+100), rating: {bullet:1400, blitz:1400, rapid:1400} };
            localStorage.setItem('ir_user', JSON.stringify(u));
            document.getElementById('hi').innerText = u.nick.toUpperCase();
            document.getElementById('rb').innerText = Math.round(u.rating.bullet);
            document.getElementById('rl').innerText = Math.round(u.rating.blitz);
            document.getElementById('rr').innerText = Math.round(u.rating.rapid);
        }

        function ov(id){ hd(); document.getElementById(id).style.display='flex'; }
        function hd(){ document.querySelectorAll('.ovl').forEach(o=>o.style.display='none'); }
        
        function stT(c, save = true){
            const color = c==='p' ? '#7b61ff' : (c==='g' ? '#45a049' : '#ff4757');
            document.documentElement.style.setProperty('--accent', color);
            if(save) localStorage.setItem('ir_theme', c);
            
            document.querySelectorAll('#th-p, #th-g, #th-b').forEach(el => el.classList.remove('active-opt'));
            const activeEl = document.getElementById('th-' + c);
            if(activeEl) activeEl.classList.add('active-opt');
        }

        function setBoard(t, save = true) {
            const r = document.documentElement;
            if(t==='brown'){ r.style.setProperty('--sq-l','#f0d9b5'); r.style.setProperty('--sq-d','#b58863'); } 
            else { r.style.setProperty('--sq-l','#ebecd0'); r.style.setProperty('--sq-d','#779556'); }
            if(save) localStorage.setItem('ir_board', t);

            document.querySelectorAll('#br-brown, #br-green').forEach(el => el.classList.remove('active-opt'));
            const activeEl = document.getElementById('br-' + t);
            if(activeEl) activeEl.classList.add('active-opt');
        }

        function initGameConfig(tc) {
            game = new Chess();
            const parts = tc.split('+');
            const minutes = parseInt(parts[0]);
            increment = parseInt(parts[1] || 0);

            whiteTime = minutes * 60;
            blackTime = minutes * 60;

            document.getElementById('m-scr').style.display = 'none';
            document.getElementById('game-scr').style.display = 'flex';
            
            updateClockDisplay();
            startTimer();
            render();
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if(!game || game.game_over()) return;

                if(game.turn() === 'w') {
                    whiteTime--;
                    if(whiteTime <= 0) endByTime('black');
                } else {
                    blackTime--;
                    if(blackTime <= 0) endByTime('white');
                }
                updateClockDisplay();
            }, 1000);
        }

        function addIncrement(color) {
            if(color === 'w') whiteTime += increment;
            else blackTime += increment;
            updateClockDisplay();
        }

        function updateClockDisplay() {
            const fmt = (s) => {
                let m = Math.floor(s / 60), sec = s % 60;
                return `${m}:${sec < 10 ? '0' : ''}${sec}`;
            };

            const myClock = document.getElementById('my-clock');
            const oppClock = document.getElementById('opp-clock');

            const myT = myColor === 'white' ? whiteTime : blackTime;
            const oppT = myColor === 'white' ? blackTime : whiteTime;

            myClock.innerText = fmt(myT);
            oppClock.innerText = fmt(oppT);

            const isMyTurn = (game.turn() === 'w' && myColor === 'white') || (game.turn() === 'b' && myColor === 'black');
            
            myClock.classList.toggle('active', isMyTurn);
            oppClock.classList.toggle('active', !isMyTurn);
            myClock.classList.toggle('low-time', myT <= 10);
            oppClock.classList.toggle('low-time', oppT <= 10);
        }

        function endByTime(winnerColor) {
            clearInterval(timerInterval);
            const win = isOffline ? (winnerColor === 'white') : (winnerColor === myColor);
            showEnd(win ? "ПОБЕДА ПО ВРЕМЕНИ!" : "ПОРАЖЕНИЕ ПО ВРЕМЕНИ!");
        }

        // Отрисовка доски с локальными файлами прямо из корня
        function render(){
            const b = document.getElementById('board'); 
            b.innerHTML = ''; 
            const boardData = game.board();
            
            let rows = [0,1,2,3,4,5,6,7];
            let cols = [0,1,2,3,4,5,6,7];
            if(!isOffline && myColor === 'black') { rows.reverse(); cols.reverse(); }

            for(let r of rows) {
                for(let c of cols) {
                    let s = boardData[r][c];
                    let id = String.fromCharCode(97+c) + (8-r);
                    let d = document.createElement('div');
                    
                    d.className = `sq ${(r+c)%2===0?'w-s':'b-s'} ${sel===id?'sel':''}`; 
                    d.dataset.id = id;

                    if(game.in_check() && s && s.type==='k' && s.color===game.turn()) d.classList.add('chk');

                    if(s){
                        const img = document.createElement('img');
                        // Путь строго к твоим загруженным png файлам в корне репозитория (например: wp.png, br.png)
                        img.src = `./${s.color}${s.type}.png`;
                        img.className = 'p-i';
                        img.draggable = true;
                        
                        img.ondragstart = (e) => {
                            e.dataTransfer.setData('text/plain', id);
                        };
                        
                        d.appendChild(img);
                    }

                    d.ondragover = (e) => e.preventDefault();
                    d.ondrop = (e) => {
                        e.preventDefault();
                        const fromId = e.dataTransfer.getData('text/plain');
                        makeMove(fromId, id);
                    };

                    d.onclick = () => squareClick(id);
                    b.appendChild(d);
                }
            }
        }

        function squareClick(id) {
            if(game.game_over()) return;
            const piece = game.get(id);
            const isMyTurn = isOffline || (game.turn() === 'w' && myColor === 'white') || (game.turn() === 'b' && myColor === 'black');
            if(!isMyTurn && !isOffline) return;

            if(sel === id) { 
                sel = null; 
            } else if(piece && (isOffline || piece.color === game.turn())) { 
                sel = id; 
            } else if(sel) {
                makeMove(sel, id);
                sel = null;
            }
            render();
        }

        // Чистая шахматная логика ходов и съедания
        function makeMove(from, to) {
            if(game.game_over()) return;
            const isMyTurn = isOffline || (game.turn() === 'w' && myColor === 'white') || (game.turn() === 'b' && myColor === 'black');
            if(!isMyTurn && !isOffline) return;

            const moveObj = { from: from, to: to, promotion: 'q' };
            const m = game.move(moveObj);
            
            if(m) { 
                sel = null; 
                addIncrement(m.color);
                
                if(!isOffline && currentRoomId) {
                    socket.emit('move', { roomId: currentRoomId, moveData: moveObj });
                }
                checkEnd();
                render();
            }
        }

        function checkEnd() {
            if(game.game_over()) {
                clearInterval(timerInterval);
                let msg = "НИЧЬЯ!";
                if(game.in_checkmate()) {
                    if(isOffline) {
                        msg = (game.turn() === 'w' ? "ЧЕРНЫЕ" : "БЕЛЫЕ") + " ПОБЕДИЛИ!";
                    } else {
                        msg = (game.turn() === (myColor==='white'?'b':'w')) ? "ВЫ ПОБЕДИЛИ!" : "ВЫ ПРОИГРАЛИ!";
                    }
                }
                showEnd(msg);
            }
        }

        function showEnd(txt) {
            document.getElementById('res-ds').innerText = txt;
            document.getElementById('res-scr').style.display = 'flex';
        }
    </script>
</body>
</html>
